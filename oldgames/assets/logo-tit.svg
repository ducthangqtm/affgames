<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="tit-neon" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Clip to circular badge frame so sonar wave never spills outside -->
    <clipPath id="tit-badge-clip">
      <circle cx="22" cy="22" r="20.8"/>
    </clipPath>
  </defs>

  <style>
    /* Continuous, slow, silky-smooth wave expansion with zero stutter (3.6s cycle) */
    @keyframes tit-sonar-smooth {
      0% {
        r: 2px;
        opacity: 0.75;
        stroke-width: 0.8px;
      }
      35% {
        opacity: 0.55;
        stroke-width: 0.65px;
      }
      70% {
        opacity: 0.35;
        stroke-width: 0.45px;
      }
      92% {
        r: 31.5px;
        opacity: 0.18;
        stroke-width: 0.35px;
      }
      100% {
        r: 34px;
        opacity: 0;
        stroke-width: 0.2px;
      }
    }

    /* Outer border surge: stays calm until wave hits the bottom edge (92-95%), then flares brilliantly */
    @keyframes tit-border-surge {
      0%, 89% {
        stroke: rgba(0, 240, 255, 0.25);
        stroke-width: 1.2px;
        filter: none;
      }
      92% {
        stroke: #00ff9d;
        stroke-width: 2.2px;
        filter: drop-shadow(0 0 4px #00ff9d);
      }
      94.5% {
        stroke: #00f0ff;
        stroke-width: 2.8px;
        filter: drop-shadow(0 0 8px #00f0ff);
      }
      98%, 100% {
        stroke: rgba(0, 240, 255, 0.25);
        stroke-width: 1.2px;
        filter: none;
      }
    }

    @keyframes tit-beacon-pulse {
      0%, 10% {
        fill: #00ff9d;
        filter: drop-shadow(0 0 4px #00ff9d);
      }
      50% {
        fill: #00f0ff;
        filter: drop-shadow(0 0 2px #00f0ff);
      }
      100% {
        fill: #00ff9d;
        filter: drop-shadow(0 0 4px #00ff9d);
      }
    }

    @keyframes tit-letters-glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.45)); }
      60% { filter: drop-shadow(0 0 5px rgba(0, 255, 157, 0.75)); }
    }

    /* AI Natural eye blink on T stems */
    @keyframes ai-eye-blink {
      0%, 86%, 100% { transform: scaleY(1); }
      89% { transform: scaleY(0.08); }
      92% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
      97% { transform: scaleY(1); }
    }

    .tit-frame-base {
      fill: url(#tit-bg);
      stroke: rgba(0, 240, 255, 0.25);
      stroke-width: 1.2;
    }

    .tit-frame-border-glow {
      fill: none;
      animation: tit-border-surge 3.6s linear infinite;
    }

    .tit-wave-pulse-1 {
      fill: none;
      stroke: rgba(0, 255, 157, 0.7);
      animation: tit-sonar-smooth 3.6s linear infinite;
    }

    .tit-beacon {
      animation: tit-beacon-pulse 3.6s ease-in-out infinite;
    }

    .tit-letters {
      animation: tit-letters-glow 3.6s ease-in-out infinite;
    }

    .ai-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: ai-eye-blink 4.5s ease-in-out infinite;
    }
  </style>

  <!-- Circular Cyber Base Frame -->
  <circle cx="22" cy="22" r="21" class="tit-frame-base"/>
  
  <!-- Wave expanding inside the badge, strictly clipped -->
  <g clip-path="url(#tit-badge-clip)">
    <circle cx="22" cy="11.8" r="2" class="tit-wave-pulse-1"/>
  </g>

  <!-- TiT Letters Group with blinking eyes -->
  <g class="tit-letters">
    <!-- LEFT T: Top horizontal bar + Stem that blinks -->
    <path d="M 7.0 15.0 H 17.0" stroke="url(#tit-neon)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 12 16.5 V 28.5" stroke="url(#tit-neon)" stroke-width="3.5" stroke-linecap="round" class="ai-eye"/>

    <!-- CENTER i: Core Stem -->
    <path d="M 22 18.5 V 28.5" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- RIGHT T: Top horizontal bar + Stem that blinks -->
    <path d="M 27.0 15.0 H 37.0" stroke="url(#tit-neon)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 32 16.5 V 28.5" stroke="url(#tit-neon)" stroke-width="3.5" stroke-linecap="round" class="ai-eye"/>
  </g>

  <!-- Center i: Antenna Beacon Dot -->
  <circle cx="22" cy="11.8" r="2.4" class="tit-beacon"/>

  <!-- Outer Border Sync Glow Ring (surges in sync when wave reaches rim) -->
  <circle cx="22" cy="22" r="21" class="tit-frame-border-glow"/>
</svg>
